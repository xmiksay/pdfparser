name: Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

# Required by actions/deploy-pages
permissions:
  contents: read
  pages: write
  id-token: write

# Only one concurrent Pages deploy at a time; let it finish rather than
# cancel mid-upload.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: cargo doc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: cargo doc
        run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

      # cargo doc lands the crate's docs at target/doc/pdf2md/. GitHub
      # Pages serves from the artifact root, so add a redirect at the
      # top level pointing at the crate's index.
      - name: Add root redirect
        run: |
          cat > target/doc/index.html <<'EOF'
          <!doctype html>
          <meta charset="utf-8">
          <meta http-equiv="refresh" content="0; url=pdf2md/index.html">
          <link rel="canonical" href="pdf2md/index.html">
          <title>pdf2md docs</title>
          EOF

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: target/doc

  deploy:
    name: deploy to gh-pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
